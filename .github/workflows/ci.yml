name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verifier:
    name: Lint, types, tests unitaires et d'intégration
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16.15
        # Même propriétaire du schéma que .env.example (DATABASE_MIGRATION_URL).
        env:
          POSTGRES_USER: ziga
          POSTGRES_PASSWORD: ziga_dev
          POSTGRES_DB: ziga
        ports: ['55432:5432']
        options: >-
          --health-cmd "pg_isready -U ziga -d ziga"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
      redis:
        image: redis:7.4.12-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Les tests d'intégration lisent .env (base ziga_test recréée à chaque exécution, stockage local).
      - run: cp .env.example .env
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  e2e:
    name: Coque et authentification (Playwright, contre la vraie API)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # L'API de test crée et migre sa propre base (ziga_e2e) et utilise la base Redis n° 2.
    services:
      postgres:
        image: postgres:16.15
        env:
          POSTGRES_USER: ziga
          POSTGRES_PASSWORD: ziga_dev
          POSTGRES_DB: ziga
        ports: ['55432:5432']
        options: >-
          --health-cmd "pg_isready -U ziga -d ziga"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
      redis:
        image: redis:7.4.12-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @ziga/web exec playwright install --with-deps chromium
      # PowerSync (lot 05) : PostgreSQL en réplication logique. Un conteneur de service ne prend pas d'options de
      # démarrage : on règle wal_level, puis on le redémarre.
      - name: PostgreSQL en réplication logique
        run: |
          docker exec ${{ job.services.postgres.id }} psql -U ziga -d ziga -c "ALTER SYSTEM SET wal_level = logical"
          docker restart ${{ job.services.postgres.id }}
          until docker exec ${{ job.services.postgres.id }} pg_isready -U ziga -d ziga; do sleep 1; done
          docker exec ${{ job.services.postgres.id }} psql -U ziga -d ziga -tAc "SHOW wal_level"
      # Image du service PowerSync, lancée par Playwright (apps/api/scripts/e2e-powersync.mjs).
      - run: docker pull journeyapps/powersync-service:1.28.1
      - run: cp .env.example .env
      - run: pnpm --filter @ziga/shared build
      - run: pnpm --filter @ziga/web test:e2e
