# Sync Streams (lot 05, D30) : ce que chaque appareil reçoit. La règle 1 de CLAUDE.md s'applique ici comme en base :
# une personne ne reçoit que les lignes des organisations dont elle est membre active, et rien d'une organisation
# suspendue. L'appartenance est lue en direct : un membre retiré, ou une organisation suspendue, sort du stream à la
# synchronisation suivante, et PowerSync efface ces données de l'appareil.
#
# Chaque requête ne sélectionne que les colonnes utiles à l'application (jamais SELECT *). Le représentant légal
# (pièce d'identité) n'est pas dans ce stream, ouvert à tous les membres. Ajouter une table :
# docs/SYNC.md. Une requête de `with` part toujours de la personne (`organizations` joint à `organization_members`,
# filtré par auth.user_id()) : une table jointe sans clé serait lue en entier pour chaque connexion (docs/SYNC.md §2,
# PSYNC_S2305 au-delà de 1 000 résultats). apps/api/test/sync-streams.int.test.ts les vérifie avec le moteur de PowerSync contre le schéma
# réel ; ce que chaque personne reçoit est vérifié contre le service par les tests Playwright (lot 05, étape 2).
config:
  edition: 3

streams:
  # Organisations de la personne et leur équipe, avec les réglages et les exceptions de fonctionnalités de chacune.
  organization_data:
    auto_subscribe: true
    with:
      my_organizations: |
        SELECT organizations.id FROM organizations
          JOIN organization_members ON organization_members.organization_id = organizations.id
        WHERE organization_members.user_id = auth.user_id()
          AND organization_members.status = 'active'
          AND organizations.verification_status != 'suspended'
    queries:
      - SELECT id, type, legal_name, trade_name, phone, address, commune, po_box, rccm, ifu, verification_status, plan_id, accepted_payment_methods, logo_id, rent_billing_mode, receipt_prefix, receipt_ticket_width, receipt_numbering_started_at, updated_at FROM organizations WHERE id IN my_organizations
      - SELECT id, organization_id, user_id, role, status, display_name, joined_at FROM organization_members WHERE organization_id IN my_organizations
      - SELECT organization_id || ':' || feature_key AS id, organization_id, feature_key, disabled_by_organization FROM organization_feature_settings WHERE organization_id IN my_organizations
      - SELECT id, feature_key, scope, organization_id, user_id, value, starts_at, ends_at FROM feature_overrides WHERE organization_id IN my_organizations AND revoked_at IS NULL
      # Lot 06 : propriétaires (sans le compte lié, user_id, qui ne quitte pas le serveur), mandats et leurs versions.
      # Tous les membres les lisent ; seuls le directeur et le gestionnaire les modifient (API). Les portées des
      # mandats désignent des biens et des unités : elles suivent les streams des biens (lot 07).
      - SELECT id, organization_id, type, name, phone, email, address, country, representative_name, representative_phone, notes, status, archived_at, created_at, updated_at FROM owners WHERE organization_id IN my_organizations
      - SELECT id, organization_id, owner_id, type, starts_on, ends_on, commission_basis, commission_rate_bp, commission_amount, can_publish, can_take_photos, can_collect_funds, can_sign_leases, exclusive, status, revoked_at, revocation_reason, expired_at, version, created_at, updated_at FROM mandates WHERE organization_id IN my_organizations
      - SELECT id, organization_id, mandate_id, version, starts_on, ends_on, commission_basis, commission_rate_bp, commission_amount, can_publish, can_take_photos, can_collect_funds, can_sign_leases, exclusive, status, revoked_at, revocation_reason, expired_at, changed_by, recorded_at FROM mandate_versions WHERE organization_id IN my_organizations
      # Lot 10 bis : pièces, éléments d'état des lieux et réparations à la charge du locataire de l'organisation (tous les
      # membres : l'agent de terrain fait les états des lieux).
      - SELECT id, organization_id, kind, key, label, elements, position, active, created_at, updated_at FROM inspection_catalog_entries WHERE organization_id IN my_organizations

  # Lot 07 : biens, unités, photos et portées des mandats, pour la direction, la gestion et le profil lecture (tous
  # les rôles sauf l'agent de terrain : PowerSync n'accepte pas de liste littérale, et les quatre rôles sont fermés par
  # la contrainte de organization_members). Les photos retirées ne descendent plus ; l'original d'une photo
  # (storage_key) ne quitte jamais le serveur.
  # Lot 08 : locataires (sans l'état civil ni la pièce d'identité : stream tenant_identities), baux et leurs versions,
  # échéances (écrites par le serveur seul), comptes de caution et leurs mouvements. Aucune occupation : elle se calcule
  # sur l'appareil à partir des baux.
  # Lot 09 : encaissements, imputations et reçus (sans les jetons, les compteurs ni les clés des PDF, qui restent sur le
  # serveur) ; direction, gestion et profil lecture.
  # Lot 10 : relances et leurs réglages, dépenses, relevés propriétaires (sans la clé du PDF ni les jetons des liens),
  # éléments consommés par les relevés émis, reversements.
  # Lot 10 bis : congés, états des lieux et leurs lignes, accords, réparations, décomptes de sortie et leurs lignes,
  # transferts de gestion ; nouvelles colonnes des baux, échéances, cautions, imputations, reçus et portées.
  # Lot 10 ter : signalements des locataires (fiche du bail), sans la personne qui signale (reported_by).
  managed_properties:
    auto_subscribe: true
    with:
      managed_organizations: |
        SELECT organizations.id FROM organizations
          JOIN organization_members ON organization_members.organization_id = organizations.id
        WHERE organization_members.user_id = auth.user_id()
          AND organization_members.status = 'active'
          AND organization_members.role != 'field_agent'
          AND organizations.verification_status != 'suspended'
    queries:
      - SELECT id, organization_id, owner_id, type, operation, name, commune_id, neighborhood_id, address_hint, gps_lat, gps_lng, gps_accuracy_m, declared_land_documents, notes, record_status, archived_at, created_at, updated_at FROM properties WHERE organization_id IN managed_organizations
      - SELECT id, organization_id, property_id, type, label, bedrooms, living_rooms, kitchens, bathrooms, terraces, laundries, surface_m2, land_area_m2, usage, furnished, amenities, rent, charges, deposit_amount, advance_months, assigned_agent_id, record_status, archived_at, technical_status, technical_reason, technical_expected_on, created_at, updated_at FROM units WHERE organization_id IN managed_organizations
      - SELECT id, organization_id, property_id, unit_id, kind, mime_type, byte_size, position, caption, variants_key, width, height, status, error, created_at, processed_at FROM media WHERE organization_id IN managed_organizations AND status != 'removed'
      - SELECT id, organization_id, mandate_id, property_id, unit_id, via_property, management_active, ended_on, management_transfer_id FROM mandate_scopes WHERE organization_id IN managed_organizations
      - SELECT id, organization_id, civility, full_name, phone, secondary_phone, nationality, profession, previous_address, emergency_contact_name, emergency_contact_phone, notes, status, archived_at, created_at, updated_at FROM tenants WHERE organization_id IN managed_organizations
      - SELECT id, organization_id, unit_id, tenant_id, starts_on, ends_on, duration_months, dues_start_on, rent, charges, rent_effective_from, periodicity, due_day, billing_mode, advance_months, lessor_type, payment_terms, penalty_rate_bp, penalty_grace_days, penalty_beneficiary, notice_tenant_fixed_term_months, notice_tenant_open_ended_months, notice_lessor_fixed_term_months, notice_lessor_open_ended_months, reduced_notice_months, reduced_notice_cases, early_termination_indemnity_months, renewal_mode, deposit_refund_days, status, activated_on, activated_at, cancelled_at, cancellation_reason, notice_given_on, exit_on, ended_at, end_reason, end_kind, version, last_renewed_on, last_renewal_automatic, original_ends_on, import_job_id, created_at, updated_at FROM leases WHERE organization_id IN managed_organizations
      - SELECT id, organization_id, lease_id, version, rent, charges, rent_effective_from, starts_on, ends_on, dues_start_on, due_day, billing_mode, periodicity, advance_months, status, changed_by, recorded_at FROM lease_versions WHERE organization_id IN managed_organizations
      - SELECT id, organization_id, lease_id, kind, period_start, period_end, due_on, rent, charges, amount_due, amount_paid, status, prorated, is_advance, lease_version, exit_adjusted_at, created_at, updated_at FROM rent_dues WHERE organization_id IN managed_organizations
      - SELECT id, organization_id, lease_id, type, agreed_amount, agreed_months, holder, holder_name, status, created_at, updated_at FROM deposit_accounts WHERE organization_id IN managed_organizations
      - SELECT id, organization_id, account_id, type, amount, previous_holder, new_holder, new_holder_name, reason, occurred_on, document_id, agreement_id, inspection_item_id, payment_id, settlement_id, settlement_line_id, rent_due_id, expense_id, repair_id, management_transfer_id, refunded_by, refund_method, refund_reference, created_by, created_at FROM deposit_movements WHERE organization_id IN managed_organizations
      - SELECT id, organization_id, kind, reverses_payment_id, lease_id, tenant_id, purpose, deposit_account_id, expense_id, amount, method, operator, transaction_reference, paid_on, status, provider, provider_reference, note, recorded_by, confirmed_at, confirmed_by, cancellation_reason, cancelled_at, cancelled_by, created_at, updated_at FROM payments WHERE organization_id IN managed_organizations
      - SELECT id, organization_id, payment_id, lease_id, target, rent_due_id, deposit_account_id, expense_id, direction, amount, source, created_by, created_at FROM payment_allocations WHERE organization_id IN managed_organizations
      - SELECT id, organization_id, payment_id, lease_id, purpose, provisional_number, number, year, sequence, status, issued_on, issued_at, snapshot, logo_id, source, cancelled_at, created_at, updated_at FROM receipts WHERE organization_id IN managed_organizations
      - SELECT id, organization_id, tenant_id, rent_due_ids, expense_ids, channel, template_level, note, sent_at, sent_by, created_at FROM reminders WHERE organization_id IN managed_organizations
      - SELECT organization_id AS id, organization_id, template_1, template_2, template_3, offset_1, offset_2, offset_3, updated_at FROM reminder_settings WHERE organization_id IN managed_organizations
      - SELECT id, organization_id, property_id, unit_id, lease_id, spent_on, category, description, supplier, amount, document_id, paid_by, borne_by, recovery, status, cancellation_reason, cancelled_at, cancelled_by, recorded_by, created_at, updated_at FROM expenses WHERE organization_id IN managed_organizations
      - SELECT id, organization_id, owner_id, month, version, corrects_statement_id, status, revision, rent_collected, charges_collected, collected, rent_collected_by_owner, charges_collected_by_owner, commission, expenses, carried_balance, net, snapshot, logo_id, generated_at, generated_by, issued_on, issued_at, issued_by, pdf_generated_at, created_at, updated_at FROM owner_statements WHERE organization_id IN managed_organizations
      - SELECT id, organization_id, statement_id, kind, role, allocation_id, expense_id, mandate_id, fee_month, lease_id, carried_statement_id, item_key, created_at FROM owner_statement_lines WHERE organization_id IN managed_organizations
      - SELECT id, organization_id, kind, reverses_payout_id, owner_id, statement_id, amount, paid_on, method, reference, note, reason, recorded_by, created_at FROM owner_payouts WHERE organization_id IN managed_organizations
      - SELECT id, organization_id, lease_id, origin, status, delivery_mode, proof_document_id, notified_on, planned_exit_on, reduced_notice, reason, notice_months, notice_ends_on, rent_ends_on, early_termination_indemnity, declined_reason, recorded_at, recorded_by, declined_at, declined_by, created_by, created_at, updated_at FROM lease_notices WHERE organization_id IN managed_organizations
      - SELECT id, organization_id, lease_id, type, status, inspected_on, performed_by, furnished, organization_signed_at, organization_signed_by, tenant_signed_at, tenant_signed_recorded_by, scan_document_id, organization_observations, tenant_observations, disputed_at, dispute_outcome, dispute_outcome_document_id, created_by, created_at, updated_at FROM inspections WHERE organization_id IN managed_organizations
      - SELECT id, organization_id, inspection_id, room, element, position, description, finding, entry_item_id, created_by, created_at, updated_at FROM inspection_items WHERE organization_id IN managed_organizations
      - SELECT id, organization_id, lease_id, type, status, proposed_by, proposed_on, description, months, kept_amount, settlement_id, decided_by_party, decided_on, decided_at, decided_by, refusal_reason, document_id, created_by, created_at, updated_at FROM agreements WHERE organization_id IN managed_organizations
      - SELECT id, organization_id, inspection_item_id, lease_id, description, performed_by, status, estimated_amount, quote_document_id, actual_amount, invoice_document_id, agreement_id, expense_id, done_on, verified_on, verified_by, created_by, created_at, updated_at FROM repairs WHERE organization_id IN managed_organizations
      - SELECT id, organization_id, deposit_account_id, lease_id, status, revision, exit_on, refund_deadline, refund_alert, received, credit, deductions, covered_by_deposit, credit_used, refund, refund_from_deposit, refund_from_credit, claim, outcome, organization_observations, tenant_observations, owner_observations, proposed_at, accepted_at, disputed_at, dispute_outcome, dispute_document_id, closed_at, closed_by, created_by, created_at, updated_at FROM deposit_settlements WHERE organization_id IN managed_organizations
      - SELECT id, organization_id, settlement_id, revision, position, kind, amount, covered, uncovered, blocker, inspection_item_id, repair_id, rent_due_id, expense_id, agreement_id, document_id, created_by, created_at FROM deposit_settlement_lines WHERE organization_id IN managed_organizations
      - SELECT id, organization_id, mandate_id, property_id, unit_id, transfer_on, new_manager_name, handed_over_on, handed_over_items, mandate_action, note, recorded_by, created_at FROM management_transfers WHERE organization_id IN managed_organizations
      - SELECT id, organization_id, lease_id, title, description, status, planned_on, done_at, status_note, handled_by, created_at, updated_at FROM maintenance_requests WHERE organization_id IN managed_organizations

  # Agent de terrain : seulement les unités qui lui sont affectées, leur bien, leurs photos et leurs portées. Une unité
  # non affectée ne descend jamais sur son téléphone ; une unité désaffectée en est effacée à la synchronisation
  # suivante (vérifié contre le vrai service, apps/web/e2e). Même filtre côté API (lot 07, étape 2).
  # Lot 08 : baux, versions et échéances de ses unités ; locataires de ces baux, avec leurs coordonnées seulement (ni
  # état civil, ni pièce d'identité, ni notes) ; aucune caution.
  # Lot 09 : encaissements, imputations et reçus des loyers de ses unités ; jamais un versement de caution.
  # Lot 10 : les relances des locataires de ses unités ; ni dépenses, ni relevés, ni reversements, ni encaissement d'une
  # dépense (seules les imputations sur échéance ou en crédit descendent).
  # Lot 10 bis : les congés enregistrés de ses baux (sans indemnité ni preuve), les états des lieux de ses unités, leurs
  # lignes, leurs photos et leurs scans (métadonnées). Jamais rien de la caution : ni compte, ni mouvement, ni décompte,
  # ni accord, ni réparation chiffrée, ni imputation sur caution (encaissement, imputation et reçu de provenance
  # `deposit` exclus).
  # Lot 10 ter : les signalements de ses baux (sans la personne qui signale).
  assigned_units:
    auto_subscribe: true
    with:
      my_units: |
        SELECT units.id FROM units
          JOIN organizations ON organizations.id = units.organization_id
          JOIN organization_members ON organization_members.organization_id = organizations.id
        WHERE units.assigned_agent_id = auth.user_id()
          AND organization_members.user_id = auth.user_id()
          AND organization_members.status = 'active'
          AND organization_members.role = 'field_agent'
          AND organizations.verification_status != 'suspended'
      my_unit_properties: |
        SELECT units.property_id FROM units
          JOIN organizations ON organizations.id = units.organization_id
          JOIN organization_members ON organization_members.organization_id = organizations.id
        WHERE units.assigned_agent_id = auth.user_id()
          AND organization_members.user_id = auth.user_id()
          AND organization_members.status = 'active'
          AND organization_members.role = 'field_agent'
          AND organizations.verification_status != 'suspended'
      my_unit_leases: |
        SELECT leases.id FROM leases
          JOIN units ON units.id = leases.unit_id
          JOIN organizations ON organizations.id = units.organization_id
          JOIN organization_members ON organization_members.organization_id = organizations.id
        WHERE units.assigned_agent_id = auth.user_id()
          AND organization_members.user_id = auth.user_id()
          AND organization_members.status = 'active'
          AND organization_members.role = 'field_agent'
          AND organizations.verification_status != 'suspended'
      my_unit_inspections: |
        SELECT inspections.id FROM inspections
          JOIN leases ON leases.id = inspections.lease_id
          JOIN units ON units.id = leases.unit_id
          JOIN organizations ON organizations.id = units.organization_id
          JOIN organization_members ON organization_members.organization_id = organizations.id
        WHERE units.assigned_agent_id = auth.user_id()
          AND organization_members.user_id = auth.user_id()
          AND organization_members.status = 'active'
          AND organization_members.role = 'field_agent'
          AND organizations.verification_status != 'suspended'
      my_unit_tenants: |
        SELECT leases.tenant_id FROM leases
          JOIN units ON units.id = leases.unit_id
          JOIN organizations ON organizations.id = units.organization_id
          JOIN organization_members ON organization_members.organization_id = organizations.id
        WHERE units.assigned_agent_id = auth.user_id()
          AND organization_members.user_id = auth.user_id()
          AND organization_members.status = 'active'
          AND organization_members.role = 'field_agent'
          AND organizations.verification_status != 'suspended'
    queries:
      - SELECT id, organization_id, owner_id, type, operation, name, commune_id, neighborhood_id, address_hint, gps_lat, gps_lng, gps_accuracy_m, declared_land_documents, notes, record_status, archived_at, created_at, updated_at FROM properties WHERE id IN my_unit_properties
      - SELECT id, organization_id, property_id, type, label, bedrooms, living_rooms, kitchens, bathrooms, terraces, laundries, surface_m2, land_area_m2, usage, furnished, amenities, rent, charges, deposit_amount, advance_months, assigned_agent_id, record_status, archived_at, technical_status, technical_reason, technical_expected_on, created_at, updated_at FROM units WHERE id IN my_units
      - SELECT id, organization_id, property_id, unit_id, kind, mime_type, byte_size, position, caption, variants_key, width, height, status, error, created_at, processed_at FROM media WHERE unit_id IN my_units AND status != 'removed'
      - SELECT id, organization_id, mandate_id, property_id, unit_id, via_property, management_active, ended_on, management_transfer_id FROM mandate_scopes WHERE unit_id IN my_units
      - SELECT id, organization_id, unit_id, tenant_id, starts_on, ends_on, duration_months, dues_start_on, rent, charges, rent_effective_from, periodicity, due_day, billing_mode, advance_months, lessor_type, payment_terms, penalty_rate_bp, penalty_grace_days, penalty_beneficiary, notice_tenant_fixed_term_months, notice_tenant_open_ended_months, notice_lessor_fixed_term_months, notice_lessor_open_ended_months, reduced_notice_months, reduced_notice_cases, early_termination_indemnity_months, renewal_mode, deposit_refund_days, status, activated_on, activated_at, cancelled_at, cancellation_reason, notice_given_on, exit_on, ended_at, end_reason, end_kind, version, last_renewed_on, last_renewal_automatic, original_ends_on, import_job_id, created_at, updated_at FROM leases WHERE unit_id IN my_units
      - SELECT id, organization_id, lease_id, version, rent, charges, rent_effective_from, starts_on, ends_on, dues_start_on, due_day, billing_mode, periodicity, advance_months, status, changed_by, recorded_at FROM lease_versions WHERE lease_id IN my_unit_leases
      - SELECT id, organization_id, lease_id, kind, period_start, period_end, due_on, rent, charges, amount_due, amount_paid, status, prorated, is_advance, lease_version, exit_adjusted_at, created_at, updated_at FROM rent_dues WHERE lease_id IN my_unit_leases
      - SELECT id, organization_id, civility, full_name, phone, secondary_phone, emergency_contact_name, emergency_contact_phone, status, archived_at, created_at, updated_at FROM tenants WHERE id IN my_unit_tenants
      - SELECT id, organization_id, kind, reverses_payment_id, lease_id, tenant_id, purpose, deposit_account_id, expense_id, amount, method, operator, transaction_reference, paid_on, status, provider, provider_reference, note, recorded_by, confirmed_at, confirmed_by, cancellation_reason, cancelled_at, cancelled_by, created_at, updated_at FROM payments WHERE lease_id IN my_unit_leases AND purpose = 'rent' AND method != 'deposit_offset'
      - SELECT id, organization_id, payment_id, lease_id, target, rent_due_id, deposit_account_id, expense_id, direction, amount, source, created_by, created_at FROM payment_allocations WHERE lease_id IN my_unit_leases AND target != 'deposit_account' AND target != 'expense' AND source != 'deposit'
      - SELECT id, organization_id, payment_id, lease_id, purpose, provisional_number, number, year, sequence, status, issued_on, issued_at, snapshot, logo_id, source, cancelled_at, created_at, updated_at FROM receipts WHERE lease_id IN my_unit_leases AND purpose = 'rent' AND source != 'deposit'
      - SELECT id, organization_id, tenant_id, rent_due_ids, expense_ids, channel, template_level, note, sent_at, sent_by, created_at FROM reminders WHERE tenant_id IN my_unit_tenants
      - SELECT id, organization_id, lease_id, origin, status, notified_on, planned_exit_on, notice_ends_on, rent_ends_on, created_at, updated_at FROM lease_notices WHERE lease_id IN my_unit_leases AND status = 'recorded'
      - SELECT id, organization_id, lease_id, title, description, status, planned_on, done_at, status_note, handled_by, created_at, updated_at FROM maintenance_requests WHERE lease_id IN my_unit_leases
      - SELECT id, organization_id, lease_id, type, status, inspected_on, performed_by, furnished, organization_signed_at, organization_signed_by, tenant_signed_at, tenant_signed_recorded_by, scan_document_id, organization_observations, tenant_observations, disputed_at, dispute_outcome, dispute_outcome_document_id, created_by, created_at, updated_at FROM inspections WHERE lease_id IN my_unit_leases
      - SELECT id, organization_id, inspection_id, room, element, position, description, finding, entry_item_id, created_by, created_at, updated_at FROM inspection_items WHERE inspection_id IN my_unit_inspections
      - SELECT id, organization_id, type, owner_id, mandate_id, property_id, unit_id, tenant_id, lease_id, lease_contract_id, contract_template_id, inspection_id, inspection_item_id, taken_at, received_after_signature, version, replaces_id, file_name, mime_type, byte_size, sha256, status, restriction, uploaded_by, created_at, activated_at, replaced_at, withdrawn_at, withdrawal_reason FROM documents WHERE lease_id IN my_unit_leases AND type = 'inspection_photo' AND restriction IS NULL
      - SELECT id, organization_id, type, owner_id, mandate_id, property_id, unit_id, tenant_id, lease_id, lease_contract_id, contract_template_id, inspection_id, inspection_item_id, taken_at, received_after_signature, version, replaces_id, file_name, mime_type, byte_size, sha256, status, restriction, uploaded_by, created_at, activated_at, replaced_at, withdrawn_at, withdrawal_reason FROM documents WHERE lease_id IN my_unit_leases AND type = 'inspection_scan' AND restriction IS NULL
      - SELECT id, organization_id, type, owner_id, mandate_id, property_id, unit_id, tenant_id, lease_id, lease_contract_id, contract_template_id, inspection_id, inspection_item_id, taken_at, received_after_signature, version, replaces_id, file_name, mime_type, byte_size, sha256, status, restriction, uploaded_by, created_at, activated_at, replaced_at, withdrawn_at, withdrawal_reason FROM documents WHERE lease_id IN my_unit_leases AND type = 'inspection_report' AND restriction IS NULL

  # Documents privés (D22) : métadonnées seulement, jamais la clé de stockage ni le fichier (URL signée de 5 minutes,
  # en ligne). Matrice des types du lot 07 : direction et gestion ; un document restreint à la direction ne descend que
  # chez le directeur. Ni l'agent de terrain, ni le profil lecture.
  organization_documents:
    auto_subscribe: true
    with:
      directed_organizations: |
        SELECT organizations.id FROM organizations
          JOIN organization_members ON organization_members.organization_id = organizations.id
        WHERE organization_members.user_id = auth.user_id()
          AND organization_members.status = 'active'
          AND organization_members.role = 'director'
          AND organizations.verification_status != 'suspended'
      managed_organizations: |
        SELECT organizations.id FROM organizations
          JOIN organization_members ON organization_members.organization_id = organizations.id
        WHERE organization_members.user_id = auth.user_id()
          AND organization_members.status = 'active'
          AND organization_members.role = 'manager'
          AND organizations.verification_status != 'suspended'
    queries:
      - SELECT id, organization_id, type, owner_id, mandate_id, property_id, unit_id, tenant_id, lease_id, lease_contract_id, contract_template_id, inspection_id, inspection_item_id, taken_at, received_after_signature, version, replaces_id, file_name, mime_type, byte_size, sha256, status, restriction, uploaded_by, created_at, activated_at, replaced_at, withdrawn_at, withdrawal_reason FROM documents WHERE organization_id IN directed_organizations
      - SELECT id, organization_id, type, owner_id, mandate_id, property_id, unit_id, tenant_id, lease_id, lease_contract_id, contract_template_id, inspection_id, inspection_item_id, taken_at, received_after_signature, version, replaces_id, file_name, mime_type, byte_size, sha256, status, restriction, uploaded_by, created_at, activated_at, replaced_at, withdrawn_at, withdrawal_reason FROM documents WHERE organization_id IN managed_organizations AND restriction IS NULL

  # Lot 08 bis : contrats, versions, modèles et avenants, pour la direction et la gestion seulement ; jamais l'agent de
  # terrain ni le profil lecture (aucune donnée de contrat, docs/UX.md §10). Les versions descendent sans la copie des
  # données ni les valeurs résolues (état civil compris), lues en ligne par l'API ; les fichiers, par URL signée.
  organization_contracts:
    auto_subscribe: true
    with:
      contract_organizations: |
        SELECT organizations.id FROM organizations
          JOIN organization_members ON organization_members.organization_id = organizations.id
        WHERE organization_members.user_id = auth.user_id()
          AND organization_members.status = 'active'
          AND organization_members.role != 'field_agent'
          AND organization_members.role != 'viewer'
          AND organizations.verification_status != 'suspended'
    queries:
      - SELECT id, organization_id, kind, name, version, replaces_id, document_id, status, inspected_at, inspection_error, detected_fields, unknown_fields, unmatched_fonts, page_count, activated_at, activated_by, retired_at, created_by, created_at, updated_at FROM contract_templates WHERE organization_id IN contract_organizations
      - SELECT id, organization_id, lease_id, amendment_id, origin, template_source, template_id, template_version, status, current_version, frozen_version, frozen_at, frozen_by, generation_status, generation_error, signing_place, signing_date, copies, expected_signers, organization_signed_on, owner_signed_on, tenant_signed_on, signature_mode, signed_document_id, signature_recorded_by, signature_recorded_at, legalized_on, legalization_commune, legalization_reference, legalization_document_id, registered_on, registration_reference, registration_document_id, legalization_reminder, created_by, created_at, updated_at FROM lease_contracts WHERE organization_id IN contract_organizations
      - SELECT id, organization_id, contract_id, number, lease_version, template_source, template_id, template_version, blank_fields, warnings, docx_document_id, pdf_document_id, docx_sha256, pdf_sha256, page_count, created_by, created_at FROM contract_versions WHERE organization_id IN contract_organizations
      - SELECT id, organization_id, lease_id, number, type, effective_from, new_rent, new_charges, new_ends_on, open_ended, description, expected_lease_version, status, applied_at, applied_lease_version, cancelled_at, cancellation_reason, created_by, created_at, updated_at FROM lease_amendments WHERE organization_id IN contract_organizations

  # Représentant légal (pièce d'identité) : réservé au directeur, comme l'écran des paramètres.
  organization_representatives:
    auto_subscribe: true
    with:
      directed_organizations: |
        SELECT organizations.id FROM organizations
          JOIN organization_members ON organization_members.organization_id = organizations.id
        WHERE organization_members.user_id = auth.user_id()
          AND organization_members.status = 'active'
          AND organization_members.role = 'director'
          AND organizations.verification_status != 'suspended'
    query: SELECT id, rep_name, rep_title, rep_profession, rep_address, rep_nationality, rep_id_type, rep_id_type_other, rep_id_number, rep_id_issued_on, rep_id_issued_by FROM organizations AS organization_representatives WHERE id IN directed_organizations

  # Lot 08 : état civil et pièce d'identité des locataires (même id que la fiche), pour le directeur et le gestionnaire
  # seulement ; jamais l'agent de terrain ni le profil lecture (comme le représentant légal, docs/SYNC.md §2).
  tenant_identities:
    auto_subscribe: true
    with:
      identity_organizations: |
        SELECT organizations.id FROM organizations
          JOIN organization_members ON organization_members.organization_id = organizations.id
        WHERE organization_members.user_id = auth.user_id()
          AND organization_members.status = 'active'
          AND organization_members.role != 'field_agent'
          AND organization_members.role != 'viewer'
          AND organizations.verification_status != 'suspended'
    query: SELECT id, organization_id, birth_date, birth_place, id_type, id_type_other, id_number, id_issued_on, id_issued_by FROM tenants AS tenant_identities WHERE organization_id IN identity_organizations

  # Exceptions de fonctionnalités posées pour la personne elle-même (D05).
  my_feature_overrides:
    auto_subscribe: true
    query: SELECT id, feature_key, scope, organization_id, user_id, value, starts_at, ends_at FROM feature_overrides WHERE user_id = auth.user_id() AND revoked_at IS NULL

  # Référentiel géographique (lot 07) : communes et quartiers, identiques pour tous, sans donnée d'organisation. Le
  # point central sert au formulaire du bien ; la vérification et la référence OSM restent au back-office.
  geography:
    auto_subscribe: true
    queries:
      - SELECT id, name, lat, lng FROM communes
      - SELECT id, commune_id, name, lat, lng FROM neighborhoods

  # Catalogue des fonctionnalités et contenu des formules : identiques pour tous, sans donnée d'organisation.
  feature_catalog:
    auto_subscribe: true
    queries:
      - SELECT key AS id, global_mode, plan_bound, requires FROM features
      - SELECT plan_id || ':' || feature_key AS id, plan_id, feature_key FROM plan_features
