# Services du développement local (CLAUDE.md §3) : PostgreSQL 16, Redis, stockage S3 (SeaweedFS, D27).
# PowerSync s'ajoute au lot 05, Gotenberg au lot 08 bis (D23).
# Démarrage : `pnpm infra:up` (attend que chaque service soit sain, puis crée le compartiment S3).
name: ziga

services:
  postgres:
    image: postgres:16.15
    # wal_level=logical : exigé par PowerSync (lot 05).
    command: ['postgres', '-c', 'wal_level=logical', '-c', 'max_replication_slots=10', '-c', 'max_wal_senders=10']
    environment:
      # Propriétaire du schéma, utilisé par les migrations (DATABASE_MIGRATION_URL) ; app_api et app_admin sont créés par la migration 0000.
      POSTGRES_USER: ziga
      POSTGRES_PASSWORD: ziga_dev
      POSTGRES_DB: ziga
    ports: ['5432:5432']
    volumes: ['postgres-data:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ziga -d ziga']
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7.4.12-alpine
    ports: ['6379:6379']
    volumes: ['redis-data:/data']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 2s
      timeout: 3s
      retries: 30

  seaweedfs:
    image: chrislusf/seaweedfs:4.51
    command:
      [
        'server',
        '-dir=/data',
        '-ip=seaweedfs',
        '-ip.bind=0.0.0.0',
        '-master.volumeSizeLimitMB=256',
        '-s3',
        '-s3.port=8333',
        '-s3.config=/etc/seaweedfs/s3.json'
      ]
    ports: ['8333:8333']
    volumes:
      - 'seaweedfs-data:/data'
      - './seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro'
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:9333/cluster/status']
      interval: 3s
      timeout: 3s
      retries: 40

volumes:
  postgres-data:
  redis-data:
  seaweedfs-data:
